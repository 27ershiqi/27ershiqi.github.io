<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 调试</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: monospace;
    }
    #debug-info {
      padding: 20px;
      background: #f0f0f0;
      border-bottom: 2px solid #ccc;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .warning { color: #ffd43b; }
    .info { color: #339af0; }
    #app {
      width: 100%;
      height: calc(100% - 200px);
    }
  </style>
</head>
<body>
  <div id="debug-info">
    <h2>🔍 GitHub Pages 部署调试</h2>
    <div id="status">初始化中...</div>
    <div id="module-test"></div>
  </div>
  
  <div id="app">
    <div style="padding: 20px; text-align: center; margin-top: 50px;">
      <h2>Vue 应用加载中...</h2>
      <p>如果长时间显示此消息，说明 Vue 应用未能正确初始化</p>
    </div>
  </div>

  <script>
    console.log('🔍 GitHub Pages 调试页面开始');
    
    // 全局错误捕获
    window.addEventListener('error', function(e) {
      console.error('全局错误:', e.error);
      document.getElementById('status').innerHTML += '<div class="error">❌ 错误: ' + e.message + '</div>';
      document.getElementById('status').innerHTML += '<div class="error">文件: ' + e.filename + ':' + e.lineno + '</div>';
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('未处理的 Promise 拒绝:', e.reason);
      document.getElementById('status').innerHTML += '<div class="error">❌ Promise 错误: ' + e.reason + '</div>';
    });

    // 检查当前环境
    document.getElementById('status').innerHTML = '<div class="info">📍 当前 URL: ' + window.location.href + '</div>';
    document.getElementById('status').innerHTML += '<div class="info">📍 Base URL: ' + window.location.origin + window.location.pathname + '</div>';
    
    // 检查资源加载
    function checkResource(url, name) {
      fetch(url)
        .then(response => {
          if (response.ok) {
            document.getElementById('status').innerHTML += '<div class="success">✅ ' + name + ' 加载成功 (' + response.status + ')</div>';
          } else {
            document.getElementById('status').innerHTML += '<div class="error">❌ ' + name + ' 加载失败: ' + response.status + '</div>';
          }
        })
        .catch(error => {
          document.getElementById('status').innerHTML += '<div class="error">❌ ' + name + ' 网络错误: ' + error.message + '</div>';
        });
    }

    // 检查主要资源
    checkResource('./assets/main-fca91385.js', 'JavaScript 文件');
    checkResource('./assets/index-38d70251.css', 'CSS 文件');

    // 测试模块导入
    document.getElementById('module-test').innerHTML = '<h3>模块导入测试:</h3>';
    
    // 尝试动态导入测试
    try {
      import('./assets/main-fca91385.js')
        .then(() => {
          document.getElementById('module-test').innerHTML += '<div class="success">✅ 动态导入成功</div>';
        })
        .catch(error => {
          document.getElementById('module-test').innerHTML += '<div class="error">❌ 动态导入失败: ' + error.message + '</div>';
        });
    } catch (error) {
      document.getElementById('module-test').innerHTML += '<div class="error">❌ 导入语法错误: ' + error.message + '</div>';
    }

    // 检查应用是否挂载
    setTimeout(() => {
      const app = document.getElementById('app');
      if (app && app.innerHTML.includes('Vue 应用加载中')) {
        document.getElementById('status').innerHTML += '<div class="error">❌ Vue 应用未能挂载</div>';
      } else {
        document.getElementById('status').innerHTML += '<div class="success">✅ Vue 应用已挂载</div>';
      }
      
      // 检查路由
      if (window.location.hash) {
        document.getElementById('status').innerHTML += '<div class="success">✅ 路由哈希: ' + window.location.hash + '</div>';
      } else {
        document.getElementById('status').innerHTML += '<div class="warning">⚠️ 无路由哈希，使用默认路由</div>';
      }
    }, 5000);

    console.log('🔍 调试脚本加载完成');
  </script>

  <!-- 加载 Vue 应用 -->
  <script type="module" crossorigin src="./assets/main-fca91385.js"></script>
  <link rel="stylesheet" href="./assets/index-38d70251.css">
</body>
</html>

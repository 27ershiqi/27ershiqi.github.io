<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日碎碎念 - 调试版</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    #debug-info {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      max-width: 300px;
      z-index: 9999;
    }
    .error {
      color: #ff6b6b;
    }
    .success {
      color: #51cf66;
    }
    .warning {
      color: #ffd43b;
    }
  </style>
</head>
<body>
  <div id="debug-info">
    <div>🔍 Vue 应用调试信息</div>
    <div id="status">初始化中...</div>
  </div>
  
  <div id="app">
    <div style="padding: 20px; text-align: center; margin-top: 100px;">
      <h2>Vue 应用加载中...</h2>
      <p>如果长时间显示此消息，说明 Vue 应用未能正确初始化</p>
    </div>
  </div>

  <script>
    // 全局错误捕获
    window.addEventListener('error', function(e) {
      console.error('全局错误:', e.error);
      document.getElementById('status').innerHTML += '<div class="error">❌ 错误: ' + e.message + '</div>';
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('未处理的 Promise 拒绝:', e.reason);
      document.getElementById('status').innerHTML += '<div class="error">❌ Promise 错误: ' + e.reason + '</div>';
    });

    // 检查资源加载
    function checkResource(url, name) {
      fetch(url)
        .then(response => {
          if (response.ok) {
            document.getElementById('status').innerHTML += '<div class="success">✅ ' + name + ' 加载成功</div>';
          } else {
            document.getElementById('status').innerHTML += '<div class="error">❌ ' + name + ' 加载失败: ' + response.status + '</div>';
          }
        })
        .catch(error => {
          document.getElementById('status').innerHTML += '<div class="error">❌ ' + name + ' 网络错误: ' + error.message + '</div>';
        });
    }

    // 检查主要资源
    checkResource('./assets/main-4d2fab31-4d2fab31-4d2fab31-4d2fab31-42d74cd6.js', 'JavaScript 文件');
    checkResource('./assets/main-4d2fab31-4d2fab31-4d2fab31-4d2fab31-4d2fab31.css', 'CSS 文件');

    // 检查应用是否挂载
    setTimeout(() => {
      const app = document.getElementById('app');
      if (app && app.innerHTML.includes('Vue 应用加载中')) {
        document.getElementById('status').innerHTML += '<div class="error">❌ Vue 应用未能挂载</div>';
      } else {
        document.getElementById('status').innerHTML += '<div class="success">✅ Vue 应用已挂载</div>';
      }
      
      // 检查路由是否工作
      if (window.location.hash) {
        document.getElementById('status').innerHTML += '<div class="success">✅ 路由哈希: ' + window.location.hash + '</div>';
      } else {
        document.getElementById('status').innerHTML += '<div class="warning">⚠️ 无路由哈希，使用默认路由</div>';
      }
    }, 3000);

    console.log('🔍 调试页面加载完成');
    document.getElementById('status').innerHTML = '<div class="success">✅ 调试脚本运行</div>';
  </script>

  <!-- 加载 Vue 应用 -->
  <script type="module" crossorigin src="./assets/main-4d2fab31-4d2fab31-4d2fab31-4d2fab31-42d74cd6.js"></script>
  <link rel="stylesheet" href="./assets/main-4d2fab31-4d2fab31-4d2fab31-4d2fab31-4d2fab31.css">
</body>
</html>
